[package]
name = "dsc-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Headless driver and diagnostics for DCS Signal Converter"

[[bin]]
name = "dcs-signal"
path = "src/main.rs"

[dependencies]
wctrl-hid = { path = "../wctrl-hid" }
dsc-bios = { path = "../dsc-bios" }
dsc-config = { path = "../dsc-config" }
dsc-engine = { path = "../dsc-engine" }
dsc-input = { path = "../dsc-input" }
dsc-device = { path = "../dsc-device" }
anyhow.workspace = true
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
hidapi = { version = "2.6", default-features = false, features = ["windows-native"] }
serde_json.workspace = true
tiny_http = { version = "0.12", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Devices_HumanInterfaceDevice", "Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_UI_Input", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
